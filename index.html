<!DOCTYPE html>
<html lang="en">
<head>
	<script src="visualizer.js" defer></script>
	<link href="styles.css" rel="stylesheet"/>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Polar Sort</title>
</head>
<body>

	<canvas height="2000" width="2000"></canvas>

	<div class="buttonPanel">
		<button class="bubble" data-name="bubble">Bubble</button>
		<button class="cocktail" data-name="cocktail">Cocktail</button>
		<button class="insertion" data-name="insertion">Insertion</button>
		<button class="selection" data-name="selection">Selection</button>
		<button class="merge" data-name="merge">Merge (recursive)</button>
		<button class="mergeBottomUp" data-name="mergeBottomUp">Merge (itterative)</button>
		<button class="quick" data-name="quick">Quick</button>
		<button class="radix" data-name="radix">Radix (base 2)</button>
		<button class="oddEven" data-name="oddEven">OddEven</button>
		<button class="tim" data-name="tim">Tim</button>
		<button class="scramble" data-name="scramble">Scramble / Reset</button>
		<button class="sort disabled" data-name="sort">Sort</button>
	</div>
	
</body>
</html>
